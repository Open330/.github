version: 2
updates:
  - package-ecosystem: cargo
    directory: /scripts/profile-gen
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies"]
