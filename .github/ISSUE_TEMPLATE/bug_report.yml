name: Bug report
description: Report something that is not working as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        For security vulnerabilities, do **not** file an issue — see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package/crate version or commit SHA.
      placeholder: "e.g. 1.2.3 or abc1234"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime (Node/Rust version), shell, etc.
      placeholder: "e.g. macOS 15, Node 22, rustc 1.85"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been reported.
          required: true
        - label: I am using the latest release.
